# Netlify configuration for the Renew SPA.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# NOTE: All redirect rules live in public/_redirects (which Netlify honors as
# the single source of truth for this site) — including the /sitemap.xml → the
# sitemap function rule and the SPA catch-all. Keeping them there avoids the
# precedence conflict that occurs when both files define routing.
